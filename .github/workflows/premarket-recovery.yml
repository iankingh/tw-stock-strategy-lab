name: 台股盤前與收盤備援

on:
  workflow_run:
    workflows: [台股每日股價紀錄]
    types: [completed]
    branches: [main]
  schedule:
    # 隔夜每小時一次，即使 GitHub 延後數小時建立事件，抵達盤前仍可補跑。
    - cron: '43 0-6,22-23 * * *'
      timezone: Asia/Taipei
    # 下午起每小時另安排一次，若延到晚間才啟動，仍可補收盤。
    - cron: '23 12-21 * * *'
      timezone: Asia/Taipei
    - cron: '11,41 7-8 * * *'
      timezone: Asia/Taipei
  workflow_dispatch:

env:
  TZ: Asia/Taipei

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      trade_date: ${{ steps.check.outputs.trade_date }}
      wait_date: ${{ steps.check.outputs.wait_date }}
      wait_mode: ${{ steps.check.outputs.wait_mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 依實際台灣時間檢查缺漏
        id: check
        run: node scripts/daily-price-tracking.mjs check-recovery

  recover:
    needs: check
    if: needs.check.outputs.trade_date != ''
    permissions:
      contents: write
      pages: write
    uses: ./.github/workflows/daily-price-tracking.yml
    with:
      mode: ${{ needs.check.outputs.mode }}
      trade_date: ${{ needs.check.outputs.trade_date }}

  standby:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.wait_date != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    concurrency:
      group: tracking-standby-${{ needs.check.outputs.wait_mode }}-${{ needs.check.outputs.wait_date }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 在 GitHub 等到指定的台灣行情時段
        env:
          TRADE_DATE: ${{ needs.check.outputs.wait_date }}
          WAIT_MODE: ${{ needs.check.outputs.wait_mode }}
        run: node scripts/daily-price-tracking.mjs wait-for-collection "$TRADE_DATE" "$WAIT_MODE"

  record-after-standby:
    needs: [check, standby]
    if: ${{ !cancelled() && needs.standby.result == 'success' }}
    permissions:
      contents: write
      pages: write
    uses: ./.github/workflows/daily-price-tracking.yml
    with:
      mode: ${{ needs.check.outputs.wait_mode }}
      trade_date: ${{ needs.check.outputs.wait_date }}
