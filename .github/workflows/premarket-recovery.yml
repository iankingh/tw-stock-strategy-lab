name: 台股盤前與收盤備援

on:
  schedule:
    # 隔夜每小時一次，即使 GitHub 延後數小時建立事件，抵達盤前仍可補跑。
    - cron: '43 0-6,22-23 * * *'
      timezone: Asia/Taipei
    # 下午起每小時另安排一次，若延到晚間才啟動，仍可補收盤。
    - cron: '23 12-21 * * *'
      timezone: Asia/Taipei
    - cron: '11,41 7-8 * * *'
      timezone: Asia/Taipei
  workflow_dispatch:

env:
  TZ: Asia/Taipei

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      trade_date: ${{ steps.check.outputs.trade_date }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 依實際台灣時間檢查缺漏
        id: check
        run: node scripts/daily-price-tracking.mjs check-recovery

  recover:
    needs: check
    if: needs.check.outputs.trade_date != ''
    permissions:
      contents: write
      pages: write
    uses: ./.github/workflows/daily-price-tracking.yml
    with:
      mode: ${{ needs.check.outputs.mode }}
      trade_date: ${{ needs.check.outputs.trade_date }}
