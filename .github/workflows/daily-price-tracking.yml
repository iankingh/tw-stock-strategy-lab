name: 台股每日股價紀錄

on:
  push:
    branches: [main]
    paths: [scripts/taiex.mjs]
  schedule:
    - cron: '0 7 * * *'
      timezone: Asia/Taipei
    - cron: '20 7 * * *'
      timezone: Asia/Taipei
    - cron: '15 9 * * *'
      timezone: Asia/Taipei
    - cron: '0 17 * * *'
      timezone: Asia/Taipei
    - cron: '45 17 * * *'
      timezone: Asia/Taipei
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      trade_date:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify 驗證資料來源，audit 檢查預測缺漏，forecast 記錄預測，close 記錄收盤，retry 補抓收盤'
        type: choice
        default: verify
        options: [verify, audit, forecast, close, retry]
      trade_date:
        description: '交易日期 YYYY-MM-DD，可留空'
        type: string

permissions:
  contents: read

jobs:
  record:
    if: github.ref == 'refs/heads/main' && github.event.schedule != '15 9 * * *' && inputs.mode != 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    concurrency:
      group: daily-price-tracking
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 設定大盤首個盤前追蹤交易日
        if: inputs.mode != 'verify'
        env:
          ACTION_SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/daily-price-tracking.mjs activate-index
      - name: 取得並記錄價格
        if: github.event_name != 'push'
        id: collect
        env:
          ACTION_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          if [ -n "$INPUT_MODE" ]; then
            mode="$INPUT_MODE"
          else
            case "$ACTION_SCHEDULE" in
              '0 7 * * *'|'20 7 * * *') mode=forecast ;;
              '0 17 * * *') mode=close ;;
              '45 17 * * *') mode=retry ;;
              *) echo "Unrecognized schedule: $ACTION_SCHEDULE"; exit 1 ;;
            esac
          fi
          node scripts/daily-price-tracking.mjs "$mode" "$TRADE_DATE" --defer-check
      - name: 儲存更新的行情與每月 CSV
        id: persist
        if: ${{ !cancelled() && inputs.mode != 'verify' }}
        run: |
          if [ ! -d data/daily-price-tracking ]; then exit 0; fi
          git add -- data/daily-price-tracking data/taiex.js
          if [ -f data/taiex-start.txt ]; then git add -- data/taiex-start.txt; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: 更新每日股價紀錄'
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: 發布最新行情到 GitHub Pages
        if: ${{ !cancelled() && steps.persist.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .status
      - name: 檢查補抓後的收盤價
        if: ${{ !cancelled() && steps.collect.outputs.retry_date != '' }}
        env:
          RETRY_DATE: ${{ steps.collect.outputs.retry_date }}
          RETRY_SCOPE: ${{ steps.collect.outputs.retry_scope }}
        run: node scripts/daily-price-tracking.mjs check-close "$RETRY_DATE" "$RETRY_SCOPE"
  audit:
    name: 檢查盤前預測缺漏
    if: github.ref == 'refs/heads/main' && (github.event.schedule == '15 9 * * *' || inputs.mode == 'audit')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 檢查每月 CSV
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: node scripts/daily-price-tracking.mjs audit "$TRADE_DATE"
