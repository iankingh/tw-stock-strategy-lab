<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台股複合交易策略工作站 — 葛蘭碧八大法則 × 布林 × MACD × 關鍵K線</title>
  <link rel="stylesheet" href="./assets/workstation.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');

    body {
      font-family: 'Noto Sans TC', 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0b0e14;
      color: #f1f5f9;
      overflow-x: hidden;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    :focus-visible {
      outline: 2px solid #fbbf24;
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }
    .chart-button {
      min-height: 36px;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 0 0.65rem;
      color: #e2e8f0;
    }
    .chart-button:hover:not(:disabled) { background: #1e293b; }
    .chart-button:disabled { opacity: 0.45; }
    #main-strategy-svg { touch-action: pan-y pinch-zoom; }
    [data-select-bar][aria-pressed="true"], [data-rule-jump][aria-pressed="true"] {
      border-color: #fbbf24;
      background: #221d18;
    }
    @media (max-width: 767px) {
      .chart-button { min-height: 44px; }
    }

    @media (max-width: 767px) {
      #stock-controls[data-open="false"] { display: none; }
      #stock-controls button, #stock-controls input, #chart-tools button, #chart-tools select, #chart-tools summary {
        min-height: 40px;
      }
    }

    /* 自訂捲軸樣式 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f59e0b;
    }
  </style>
</head>
<body class="min-h-screen bg-[#0b0e14] text-slate-100 selection:bg-amber-500/30">

  <!-- 頂部導覽與股價搜尋 -->
  <header class="border-b border-slate-800/80 bg-[#0f131c] px-3 py-2 md:px-6 md:py-3">
    <div class="max-w-[1440px] mx-auto flex flex-wrap items-center justify-between gap-x-4 gap-y-1">
      <h1 class="hidden md:block text-lg font-bold tracking-tight text-white">台股複合交易策略工作站</h1>
      <h1 id="mobile-stock-title" class="min-w-0 flex-1 truncate text-base font-bold md:hidden">台灣加權指數（TAIEX）</h1>
      <button type="button" id="mobile-market-home" data-stock="TAIEX" hidden
        class="chart-button md:hidden text-sm">回大盤</button>
      <button id="stock-controls-toggle" type="button" aria-expanded="false" aria-controls="stock-controls"
        class="md:hidden min-h-11 rounded-lg border border-slate-700 px-4 text-sm font-semibold text-amber-300">選標的</button>
      <span id="status-badge-text" role="status" class="order-3 w-full text-xs text-slate-300 md:order-none md:w-auto">準備載入日 K</span>
      <div id="stock-controls" data-open="false" class="order-4 w-full flex flex-wrap items-center gap-2 py-2 md:order-none md:w-auto md:py-0">
        <div id="preset-buttons-container" class="flex flex-wrap items-center gap-1"></div>
        <form id="stock-search-form" class="flex items-center">
          <input id="custom-stock-input" type="text" aria-label="股票代號" placeholder="股票代號，如 2409"
            class="w-36 min-w-0 rounded-l-lg border border-slate-700 bg-slate-900 px-2.5 py-1.5 text-sm placeholder:text-slate-400" />
          <button type="submit" class="rounded-r-lg border border-l-0 border-amber-500/50 bg-amber-500/20 px-3 py-1.5 text-sm font-semibold text-amber-300">查日 K</button>
        </form>
      </div>
    </div>
  </header>

  <!-- 匯出成功提示訊息條 (預設隱藏，取代 alert) -->
  <div id="toast-notification" class="hidden fixed bottom-5 right-5 z-50 bg-emerald-950/95 border border-emerald-400 text-emerald-200 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 text-xs font-semibold">
    <span class="text-base">✅</span>
    <span id="toast-text">檔案已匯出！</span>
  </div>

  <!-- 主內容區 -->
  <main class="max-w-[1440px] mx-auto px-3 py-3 md:px-6 md:py-5 space-y-4">
    <section class="rounded-xl border border-slate-800 bg-[#151924] p-3 md:p-4">
      <div class="grid gap-3 md:grid-cols-[1fr_1fr_auto] md:gap-5">
        <div>
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h2 id="stock-title" class="hidden truncate text-lg font-bold md:block">台灣加權指數（TAIEX）</h2>
              <span id="stock-en-name" class="hidden text-xs text-slate-400 md:inline"></span>
              <span id="stock-sector-badge" class="hidden text-xs text-slate-400 md:inline"></span>
              <div id="stock-summary-status" class="text-xs font-medium text-slate-300"></div>
            </div>
            <div class="shrink-0 text-right">
              <div id="today-price-label" class="text-xs text-slate-300">最新收盤</div>
              <div id="stock-current-price" class="font-mono text-xl font-bold text-slate-200">—</div>
              <p id="stock-close-source" class="text-xs text-slate-400"></p>
            </div>
          </div>
          <div class="mt-1.5 flex flex-wrap gap-x-4 gap-y-1 text-xs">
            <span><span id="ma20-label-title" class="text-slate-300">MA20</span> <b id="stock-ma20-val" class="font-mono text-amber-300">—</b></span>
            <span id="stock-ma60-summary"><span class="text-slate-300">MA60</span> <b id="stock-ma60-val" class="font-mono text-sky-300">—</b></span>
          </div>
        </div>

        <div id="premarket-summary" class="border-t border-slate-800 pt-2 md:border-l md:border-t-0 md:pl-5 md:pt-0">
          <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
            <h3 class="text-sm font-semibold text-slate-100">盤前預測</h3>
            <time id="premarket-date" class="font-mono text-xs text-slate-400"></time>
            <a href="https://github.com/iankingh/tw-stock-strategy-lab/tree/main/data/tracking-incidents" class="text-xs text-sky-300 underline" target="_blank" rel="noopener noreferrer">排程異常紀錄</a>
          </div>
          <p id="premarket-status" role="status" class="mt-1 text-xs text-slate-300"></p>
          <div id="premarket-values" class="mt-1 flex flex-wrap items-baseline gap-x-3 gap-y-1 text-xs" hidden>
            <span class="text-slate-300">預估收盤 <strong id="premarket-price" class="font-mono text-base text-slate-100"></strong></span>
            <span class="text-slate-300">方向 <strong id="premarket-direction" class="text-sm"></strong></span>
            <time id="premarket-recorded" class="font-mono text-slate-400"></time>
          </div>
        </div>

        <div class="flex flex-wrap items-start gap-x-3 md:flex-col md:items-end md:gap-y-1">
          <a id="intraday-quote-link" href="https://mis.twse.com.tw/" target="_blank" rel="noopener noreferrer"
            title="另開證交所基本市況報導網站" class="chart-button inline-flex items-center text-xs font-semibold text-amber-300">盤中行情</a>
          <details id="manual-price-details" class="text-xs text-slate-300 md:self-start">
            <summary class="min-h-8 cursor-pointer py-1.5 font-medium text-slate-300 hover:text-white">校正基準價</summary>
            <form id="manual-price-form" class="mt-2 flex items-center">
              <input id="manual-price-input" aria-label="校正後基準價" type="number" min="0.01" step="0.01"
                class="w-24 rounded-l-lg border border-slate-700 bg-slate-950 px-2 py-1.5 font-mono text-sm text-white" />
              <button type="submit" class="rounded-r-lg border border-l-0 border-amber-500/50 bg-amber-500/15 px-2.5 py-1.5 text-sm font-semibold text-amber-300">套用</button>
            </form>
            <p id="stock-strategy-advice" class="mt-1 text-xs text-slate-300"></p>
          </details>
        </div>
      </div>
    </section>

    <div class="grid min-w-0 grid-cols-1 gap-4 xl:grid-cols-12">
        <section class="min-w-0 rounded-xl border border-slate-800 bg-[#131722] p-3 md:p-4 xl:col-span-8" aria-label="日 K 圖表">
          <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
            <div id="chart-modes" hidden class="inline-flex max-w-full flex-wrap gap-1 rounded-lg bg-slate-950/80 p-1" aria-label="圖表模式" role="group">
              <button type="button" id="mode-btn-forecast" data-mode="RECENT_FORECAST">日 K ＋ 情境</button>
              <button type="button" id="mode-btn-fullcycle" data-mode="FULL_CYCLE">全週期示範</button>
            </div>
            <p id="chart-data-source" class="text-xs leading-relaxed text-slate-300"></p>
          </div>
          <div id="chart-top-hud" class="mb-1 flex flex-wrap justify-between gap-x-3 gap-y-1 text-xs"></div>

          <div class="relative min-w-0 w-full select-none">
            <svg id="main-strategy-svg" viewBox="0 0 1000 567" tabindex="0" role="group"
              aria-label="K 線圖，使用左右方向鍵選取交易日，按 Home 回基準日"
              class="block h-auto w-full cursor-crosshair"></svg>
          </div>
          <div id="chart-navigation" class="my-2 flex flex-wrap items-center gap-1.5 text-sm" aria-label="選取交易日" role="group" hidden>
            <button type="button" data-day-step="-1" class="chart-button">前一日</button>
            <button type="button" data-day-step="1" class="chart-button">後一日</button>
            <button type="button" class="chart-button" data-reset-selection>回基準日</button>
            <span id="chart-selection-status" class="sr-only" role="status"></span>
          </div>

          <div id="chart-legend" class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-300">
            <span data-legend="granville" class="inline-flex items-center gap-1.5"><i class="inline-block h-0.5 w-3 bg-amber-400"></i><span id="legend-ma-period">MA20</span></span>
            <span data-legend="ma60" class="inline-flex items-center gap-1.5"><i class="inline-block w-3 border-t border-dashed border-sky-400"></i>MA60</span>
            <span data-legend="bollinger" class="inline-flex items-center gap-1.5"><i class="inline-block h-2 w-3 border border-blue-400/50 bg-blue-500/20"></i>布林通道 <span id="legend-bb-std">2.0</span>σ</span>
          </div>

          <details id="chart-tools" class="mt-3 border-t border-slate-800 pt-1 text-sm text-slate-300">
            <summary class="min-h-10 cursor-pointer py-2 font-semibold text-slate-100">圖層與法則</summary>
            <div class="space-y-3 pb-2">
              <div class="flex flex-wrap gap-1.5" role="group" aria-label="圖層">
                <button type="button" id="filter-btn-granville" data-filter="granville">葛蘭碧均線</button>
                <button type="button" id="filter-btn-bollinger" data-filter="bollinger">布林通道</button>
                <button type="button" id="filter-btn-macd" data-filter="macd">MACD</button>
                <button type="button" id="filter-btn-pa" data-filter="priceAction">關鍵 K 線</button>
              </div>
              <div id="rule-jump-buttons" class="flex flex-wrap gap-1.5" role="group" aria-label="定位葛蘭碧法則"></div>
              <p id="rule-jump-status" role="status" class="text-sm text-amber-300" hidden></p>
              <div class="flex flex-wrap items-center gap-3 text-sm">
                <label class="flex items-center gap-1.5">均線
                  <select id="select-ma-period" class="rounded border border-slate-700 bg-slate-900 px-2 py-1 text-slate-200">
                    <option value="10">MA10</option>
                    <option value="20" selected>MA20</option>
                    <option value="60">MA60</option>
                  </select>
                </label>
                <label class="flex items-center gap-1.5">布林標準差
                  <select id="select-bb-std" class="rounded border border-slate-700 bg-slate-900 px-2 py-1 text-slate-200">
                    <option value="1.5">1.5 σ</option>
                    <option value="2.0" selected>2.0 σ</option>
                    <option value="2.5">2.5 σ</option>
                  </select>
                </label>
              </div>
            </div>
          </details>
          <div class="mt-2 flex flex-wrap gap-2 border-t border-slate-800 pt-2 text-sm">
            <button type="button" data-download="csv" class="chart-button" disabled>下載 CSV</button>
            <button type="button" data-download="json" class="chart-button" disabled>下載 JSON</button>
          </div>
          <p class="mt-2 text-xs text-slate-400">圖表與情境模擬僅供研究與教學參考。</p>
        </section>

        <!-- 右側：四維度檢核表與未來情境模擬 -->
        <div class="xl:col-span-4 flex flex-col gap-4">
          <!-- 卡片 1：四維度訊號真偽檢核表 -->
          <div class="bg-[#151924] border border-slate-800 rounded-xl p-4 shadow-xl">
            <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
              <div>
                <h2 class="text-sm font-bold text-white flex items-center gap-1.5">
                  四維度技術訊號
                </h2>
                <p id="checklist-date-subtitle" class="text-[11px] text-amber-300 font-mono mt-0.5"></p>
              </div>
              <div class="text-right">
                <div class="text-[10px] text-slate-400">規則評分</div>
                <div id="checklist-score-val" class="text-xl font-mono font-bold text-emerald-400">
                  —
                </div>
              </div>
            </div>
            <div id="checklist-items-container" class="divide-y divide-slate-800"></div>
          </div>

          <!-- 卡片 2：未來情境模擬 -->
          <div id="scenario-panel" hidden class="bg-[#151924] border border-slate-800 rounded-xl p-4 shadow-xl">
            <div class="pb-2.5 mb-3 border-b border-slate-800">
              <h2 id="scenario-box-title" class="text-xs font-bold text-amber-400">未來情境模擬</h2>
            </div>
            <div id="scenario-cards-container" class="space-y-2.5 text-xs"></div>
          </div>
        </div>
    </div>

    <!-- 底部葛蘭碧八大買賣點完整速查矩陣 -->
    <section class="bg-[#151924] border border-slate-800 rounded-xl p-4 shadow-xl">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <h3 class="text-sm font-bold text-white">
          📖 葛蘭碧八大法則 × 三大濾網 完整速查表（點擊任一卡片可直接於圖表定位）
        </h3>
        <span class="text-xs text-slate-400">
          口訣：先看布林辨盤整、再看均線找位置、MACD 驗背離、反轉 K 線扣板機
        </span>
      </div>
      <div id="granville-matrix-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></div>
    </section>

  </main>

  <!-- ============================================================================ -->
  <!-- 純前端核心 JavaScript 引擎 (零外部框架依賴，原生支援所有計算、繪圖與檔案匯出) -->
  <!-- ============================================================================ -->
  <script type="module" src="./workstation.js"></script>
</body>
</html>
